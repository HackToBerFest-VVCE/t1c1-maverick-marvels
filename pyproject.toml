[project]
name = "saakshi"
version = "0.1.0"
description = "AI-powered audit system for VB-G RAM G workers using Google Gemma 4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-genai>=0.1.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "pillow>=10.4.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "indic-transliteration>=2.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
